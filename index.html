<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aria — Your AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --accent:#6C63FF; --accent-dark:#4b44cc; --accent-glow:rgba(108,99,255,0.25);
  --bg:#0e0e12; --surface:#16161d; --surface2:#1f1f2a; --surface3:#272733;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.12);
  --text:#f0f0f5; --muted:#888899; --muted2:#555566;
  --user-bubble:#6C63FF; --ai-bubble:#1f1f2a;
  --font:'Sora',sans-serif; --mono:'JetBrains Mono',monospace; --r:18px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;z-index:10;}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:#fff;flex-shrink:0;}
.header-info h1{font-size:15px;font-weight:600;}
.online{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.online::before{content:'';width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.hbtns{margin-left:auto;display:flex;gap:6px;}
.ibtn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .15s;}
.ibtn:hover{background:var(--surface2);color:var(--text);}
#toolbar{display:flex;align-items:center;gap:8px;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;overflow-x:auto;}
#toolbar::-webkit-scrollbar{display:none;}
.tool-btn{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-family:var(--font);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.tool-btn:hover{border-color:var(--border2);color:var(--text);}
.tool-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(108,99,255,.1);}
.tool-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
#msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;}
#msgs::-webkit-scrollbar{width:4px;}
#msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.mrow{display:flex;gap:10px;animation:fi .22s ease;}
@keyframes fi{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.mrow.user{flex-direction:row-reverse;}
.mavatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;align-self:flex-end;}
.mrow.ai .mavatar{background:linear-gradient(135deg,var(--accent),#a78bfa);color:#fff;}
.mrow.user .mavatar{background:var(--surface2);border:1px solid var(--border);color:var(--muted);}
.bubble{max-width:min(74%,700px);padding:11px 15px;border-radius:var(--r);font-size:14px;line-height:1.75;word-break:break-word;}
.mrow.ai .bubble{background:var(--ai-bubble);border:1px solid var(--border);border-bottom-left-radius:4px;}
.mrow.user .bubble{background:var(--user-bubble);color:#fff;border-bottom-right-radius:4px;}
.bubble p{margin-bottom:.5em;}.bubble p:last-child{margin-bottom:0;}
.bubble code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;}
.bubble pre{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;position:relative;}
.bubble pre code{background:none;padding:0;font-size:12px;}
.copy-code{position:absolute;top:8px;right:8px;background:var(--surface3);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;font-family:var(--font);}
.copy-code:hover{color:var(--text);}
.bubble strong{font-weight:600;}.bubble em{font-style:italic;}
.bubble ul,.bubble ol{padding-left:18px;margin:6px 0;}.bubble li{margin-bottom:3px;}
.bubble h1,.bubble h2,.bubble h3{font-weight:600;margin:10px 0 4px;}
.bubble h1{font-size:17px;}.bubble h2{font-size:15px;}.bubble h3{font-size:14px;}
.bubble table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px;}
.bubble th,.bubble td{border:1px solid var(--border2);padding:6px 10px;text-align:left;}
.bubble th{background:var(--surface3);font-weight:600;}
.bubble blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:4px 12px;color:var(--muted);}
.search-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--surface3);border:1px solid var(--border);border-radius:12px;padding:2px 8px;margin-bottom:8px;}
.file-preview{display:flex;align-items:center;gap:8px;background:var(--surface3);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:12px;color:var(--muted);}
.tdots{display:flex;gap:4px;align-items:center;height:20px;}
.tdots span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:bo 1.2s infinite;}
.tdots span:nth-child(2){animation-delay:.2s;}.tdots span:nth-child(3){animation-delay:.4s;}
@keyframes bo{0%,80%,100%{transform:translateY(0);opacity:.3;}40%{transform:translateY(-5px);opacity:1;}}
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px;flex:1;}
.orb{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#a78bfa);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 0 40px var(--accent-glow);animation:flt 3s ease-in-out infinite;}
@keyframes flt{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
#welcome h2{font-size:20px;font-weight:600;}
#welcome p{font-size:13px;color:var(--muted);max-width:340px;line-height:1.6;}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:6px;}
.chip{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 13px;font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;}
.chip:hover{border-color:var(--accent);color:var(--text);}
footer{padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;}
.file-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.fchip{display:flex;align-items:center;gap:6px;background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted);}
.fchip button{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:13px;line-height:1;}
.iwrap{display:flex;gap:8px;align-items:flex-end;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:9px 12px;transition:border-color .15s;}
.iwrap:focus-within{border-color:rgba(108,99,255,.5);}
#inp{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:var(--font);font-size:14px;resize:none;line-height:1.6;max-height:120px;overflow-y:auto;}
#inp::placeholder{color:var(--muted);}
.send{width:34px;height:34px;border-radius:10px;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;transition:all .15s;flex-shrink:0;}
.send:hover{background:var(--accent-dark);transform:scale(1.05);}
.send:disabled{opacity:.4;cursor:default;transform:none;}
.fnote{text-align:center;font-size:11px;color:var(--muted2);margin-top:7px;}
#spanel{display:none;position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:var(--surface);border-left:1px solid var(--border);padding:20px;flex-direction:column;gap:16px;z-index:200;overflow-y:auto;animation:si .2s ease;}
@keyframes si{from{transform:translateX(100%);}to{transform:translateX(0);}}
#spanel.open{display:flex;}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.sh h2{font-size:15px;font-weight:600;}
.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:8px 11px;outline:none;}
.field textarea{resize:vertical;min-height:80px;line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);}
.sbtn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px;font-size:14px;font-family:var(--font);font-weight:500;cursor:pointer;width:100%;transition:background .15s;}
.sbtn:hover{background:var(--accent-dark);}
.sdivider{border:none;border-top:1px solid var(--border);margin:4px 0;}
.slabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;}
#overlay.show{display:block;}
</style>
</head>
<body>
<header>
  <div class="logo" id="hlogo">A</div>
  <div class="header-info"><h1 id="hname">Aria</h1><div class="online">Online &amp; ready</div></div>
  <div class="hbtns">
    <button class="ibtn" title="Clear chat" onclick="clearChat()">🗑</button>
    <button class="ibtn" title="Settings" onclick="toggleSettings()">⚙️</button>
  </div>
</header>

<div id="toolbar">
  <button class="tool-btn" id="btn-search" onclick="toggleTool('search')"><span class="tool-dot"></span> Web search</button>
  <button class="tool-btn" onclick="document.getElementById('fileInput').click()">📎 Attach file</button>
  <button class="tool-btn" id="btn-research" onclick="toggleTool('research')"><span class="tool-dot"></span> Deep research</button>
  <button class="tool-btn" onclick="showMemory()">🧠 Memory</button>
</div>
<input type="file" id="fileInput" style="display:none" accept="image/*,.pdf,.txt,.csv,.md" multiple onchange="handleFiles(this.files)"/>

<div id="msgs">
  <div id="welcome">
    <div class="orb">✦</div>
    <h2>Hi, I'm <span id="wname">Aria</span></h2>
    <p>Your intelligent AI assistant with web search, file reading, memory, and more.</p>
    <div class="chips">
      <button class="chip" onclick="useChip(this)">🔍 Search latest AI news</button>
      <button class="chip" onclick="useChip(this)">📄 Analyse a PDF for me</button>
      <button class="chip" onclick="useChip(this)">💡 Brainstorm startup ideas</button>
      <button class="chip" onclick="useChip(this)">🐛 Debug my code</button>
      <button class="chip" onclick="useChip(this)">✍️ Help me write an email</button>
      <button class="chip" onclick="useChip(this)">🌐 What's happening in the world?</button>
    </div>
  </div>
</div>

<footer>
  <div class="file-chips" id="fileChips"></div>
  <div class="iwrap">
    <button class="ibtn" style="width:28px;height:28px;font-size:13px;flex-shrink:0;" onclick="document.getElementById('fileInput').click()">📎</button>
    <textarea id="inp" placeholder="Message Aria…" rows="1"></textarea>
    <button class="send" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="fnote">Aria can make mistakes. Verify important information.</div>
</footer>

<div id="overlay" onclick="toggleSettings()"></div>
<div id="spanel">
  <div class="sh"><h2>Settings</h2><button class="ibtn" onclick="toggleSettings()">✕</button></div>
  <div class="slabel">IDENTITY</div>
  <div class="field"><label>Assistant name</label><input type="text" id="s-name" value="Aria"/></div>
  <div class="field"><label>Personality / system prompt</label><textarea id="s-system">You are Aria, a friendly and highly capable AI assistant. You are helpful, thoughtful, and concise. When using web search, always cite your sources.</textarea></div>
  <hr class="sdivider"/>
  <div class="slabel">AI MODEL</div>
  <div class="field"><label>Model</label>
    <select id="s-model">
      <option value="claude-sonnet-4-20250514" selected>Claude Sonnet 4 — Recommended</option>
      <option value="claude-opus-4-20250514">Claude Opus 4 — Most capable</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 — Fastest</option>
    </select>
  </div>
  <hr class="sdivider"/>
  <div class="slabel">APPEARANCE</div>
  <div class="field"><label>Accent colour</label><input type="color" id="s-accent" value="#6C63FF" style="height:36px;padding:3px;"/></div>
  <button class="sbtn" onclick="saveSettings()">Save settings</button>
  <button class="sbtn" style="background:var(--surface3);color:var(--muted);margin-top:4px;" onclick="clearMemory()">Clear memory &amp; start fresh</button>
</div>

<script>
// ── PROXY: same origin — no URL needed! ──
// Because the server serves this HTML, all API calls go to the same Railway domain.
const API = '';  // empty = same origin

let cfg = {
  name: 'Aria',
  system: 'You are Aria, a friendly and highly capable AI assistant. You are helpful, thoughtful, and concise. When using web search, always cite your sources.',
  model: 'claude-sonnet-4-20250514',
  accent: '#6C63FF',
};
let sessionId = null;
let isLoading = false;
let tools = { search: false, research: false };
let pendingFiles = [];

(function init() {
  const saved = localStorage.getItem('aria-cfg');
  if (saved) { try { cfg = { ...cfg, ...JSON.parse(saved) }; } catch(e) {} }
  sessionId = localStorage.getItem('aria-session') || null;
  applyConfig();
  syncPanel();
})();

function applyConfig() {
  document.title = cfg.name + ' — Your AI Assistant';
  document.getElementById('hname').textContent = cfg.name;
  document.getElementById('hlogo').textContent = cfg.name[0].toUpperCase();
  const wn = document.getElementById('wname'); if (wn) wn.textContent = cfg.name;
  document.getElementById('inp').placeholder = `Message ${cfg.name}…`;
  document.documentElement.style.setProperty('--accent', cfg.accent);
  document.documentElement.style.setProperty('--accent-dark', shade(cfg.accent, -22));
  document.documentElement.style.setProperty('--accent-glow', cfg.accent + '40');
}
function syncPanel() {
  document.getElementById('s-name').value = cfg.name;
  document.getElementById('s-system').value = cfg.system;
  document.getElementById('s-model').value = cfg.model;
  document.getElementById('s-accent').value = cfg.accent;
}
function shade(hex, p) {
  const n = parseInt(hex.replace('#',''), 16);
  const c = v => Math.min(255, Math.max(0, v));
  return '#'+[c((n>>16)+p),c(((n>>8)&0xff)+p),c((n&0xff)+p)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function toggleSettings() {
  document.getElementById('spanel').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function saveSettings() {
  cfg.name   = document.getElementById('s-name').value.trim() || 'Aria';
  cfg.system = document.getElementById('s-system').value.trim();
  cfg.model  = document.getElementById('s-model').value;
  cfg.accent = document.getElementById('s-accent').value;
  localStorage.setItem('aria-cfg', JSON.stringify(cfg));
  applyConfig(); toggleSettings();
}
function toggleTool(t) {
  if (t === 'research') { tools.research = !tools.research; if (tools.research) tools.search = true; }
  else { tools[t] = !tools[t]; if (!tools[t] && t==='search') tools.research = false; }
  document.getElementById('btn-search').classList.toggle('on', tools.search);
  document.getElementById('btn-research').classList.toggle('on', tools.research);
}
function showMemory() {
  alert(`Session ID: ${sessionId || 'none yet'}\nMemory persists for 24h on the server.\nUse "Clear memory" in Settings ⚙️ to reset.`);
}
function handleFiles(fl) {
  for (const f of fl) {
    if (pendingFiles.length >= 5) { alert('Max 5 files at once.'); break; }
    const r = new FileReader();
    r.onload = e => { pendingFiles.push({ file: f, name: f.name, dataUrl: e.target.result }); renderChips(); };
    r.readAsDataURL(f);
  }
  document.getElementById('fileInput').value = '';
}
function renderChips() {
  document.getElementById('fileChips').innerHTML = pendingFiles.map((f,i) =>
    `<div class="fchip">${f.file.type.startsWith('image/')? '🖼':f.file.type==='application/pdf'?'📄':'📝'} ${esc(f.name)}<button onclick="removeFile(${i})">✕</button></div>`).join('');
}
function removeFile(i) { pendingFiles.splice(i,1); renderChips(); }
function clearChat() { if (!confirm('Clear chat and memory?')) return; clearMemory(); }
async function clearMemory() {
  if (sessionId) { try { await fetch(`${API}/api/session/${sessionId}`, { method:'DELETE' }); } catch(e){} }
  sessionId = null; localStorage.removeItem('aria-session');
  pendingFiles = []; renderChips();
  const msgs = document.getElementById('msgs'); msgs.innerHTML = ''; addWelcome();
  if (document.getElementById('spanel').classList.contains('open')) toggleSettings();
}
function addWelcome() {
  const msgs = document.getElementById('msgs');
  const w = document.createElement('div'); w.id = 'welcome';
  w.innerHTML = `<div class="orb">✦</div><h2>Hi, I'm <span id="wname">${esc(cfg.name)}</span></h2><p>Your intelligent AI assistant with web search, file reading, memory, and more.</p><div class="chips"><button class="chip" onclick="useChip(this)">🔍 Search latest AI news</button><button class="chip" onclick="useChip(this)">📄 Analyse a PDF for me</button><button class="chip" onclick="useChip(this)">💡 Brainstorm startup ideas</button><button class="chip" onclick="useChip(this)">🐛 Debug my code</button></div>`;
  msgs.appendChild(w);
}
function removeWelcome() { const w = document.getElementById('welcome'); if(w) w.remove(); }
function useChip(btn) {
  const txt = btn.textContent;
  if (txt.includes('Search')||txt.includes('happening')) { tools.search=true; document.getElementById('btn-search').classList.add('on'); }
  document.getElementById('inp').value = txt.replace(/^[^\s]+\s/,'');
  sendMessage();
}
async function sendMessage() {
  if (isLoading) return;
  const inp = document.getElementById('inp');
  const text = inp.value.trim();
  const hasFiles = pendingFiles.length > 0;
  if (!text && !hasFiles) return;
  inp.value = ''; inp.style.height = 'auto';
  isLoading = true; document.getElementById('sendBtn').disabled = true;
  showUserBubble(text, pendingFiles);
  const filesToSend = [...pendingFiles]; pendingFiles = []; renderChips();
  addTyping();
  try {
    let reply, newSid;
    if (filesToSend.length > 0) ({ reply, sessionId: newSid } = await sendWithFiles(text, filesToSend));
    else if (tools.research) ({ reply, sessionId: newSid } = await sendResearch(text));
    else ({ reply, sessionId: newSid } = await sendText(text));
    removeTyping();
    if (newSid) { sessionId = newSid; localStorage.setItem('aria-session', sessionId); }
    addAiBubble(reply, tools.search || tools.research);
  } catch(err) {
    removeTyping();
    addAiBubble(`⚠️ Error: ${err.message}`, false);
  }
  isLoading = false; document.getElementById('sendBtn').disabled = false; inp.focus();
}
async function sendText(text) {
  const res = await fetch(`${API}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ message:text, sessionId, system:cfg.system, model:cfg.model, useWebSearch:tools.search }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Server error');
  return data;
}
async function sendResearch(text) {
  const res = await fetch(`${API}/api/chat`, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ message:`You are conducting deep research. The user asked: "${text}"\nSearch multiple times then synthesise a thorough, well-cited answer.`,
      sessionId, system: cfg.system + '\n\nYou are in Deep Research mode. Search multiple times, then synthesise a thorough answer with citations.', model:cfg.model, useWebSearch:true }) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Server error');
  return data;
}
async function sendWithFiles(text, files) {
  let lastData = null;
  for (const f of files) {
    const fd = new FormData();
    fd.append('file', f.file, f.name);
    fd.append('message', text || 'Please analyse this file.');
    if (sessionId) fd.append('sessionId', sessionId);
    fd.append('system', cfg.system); fd.append('model', cfg.model);
    const res = await fetch(`${API}/api/chat-with-file`, { method:'POST', body:fd });
    lastData = await res.json();
    if (!res.ok) throw new Error(lastData.error || 'File upload error');
    if (lastData.sessionId) sessionId = lastData.sessionId;
  }
  return lastData;
}
function showUserBubble(text, files) {
  removeWelcome();
  const msgs = document.getElementById('msgs');
  const row = document.createElement('div'); row.className = 'mrow user';
  let fh = '';
  for (const f of files) fh += f.file.type.startsWith('image/') ? `<img src="${f.dataUrl}" style="max-width:100%;max-height:180px;border-radius:10px;display:block;margin-bottom:6px;"/>` : `<div class="file-preview">📄 ${esc(f.name)}</div>`;
  row.innerHTML = `<div class="mavatar">👤</div><div class="bubble">${fh}${text ? formatMd(text) : ''}</div>`;
  msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
}
function addAiBubble(text, wasSearch) {
  removeWelcome();
  const msgs = document.getElementById('msgs');
  const row = document.createElement('div'); row.className = 'mrow ai';
  const tag = wasSearch ? `<div class="search-tag">🔍 Web search used</div>` : '';
  row.innerHTML = `<div class="mavatar">${esc(cfg.name[0].toUpperCase())}</div><div class="bubble">${tag}${formatMd(text)}</div>`;
  msgs.appendChild(row); msgs.scrollTop = msgs.scrollHeight;
  row.querySelectorAll('pre').forEach(pre => {
    const btn = document.createElement('button'); btn.className = 'copy-code'; btn.textContent = 'Copy';
    btn.onclick = () => { navigator.clipboard.writeText(pre.querySelector('code')?.textContent||pre.textContent); btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy',1500); };
    pre.style.position='relative'; pre.appendChild(btn);
  });
}
function addTyping() {
  removeWelcome();
  const msgs = document.getElementById('msgs');
  const row = document.createElement('div'); row.className='mrow ai'; row.id='typing';
  row.innerHTML=`<div class="mavatar">${esc(cfg.name[0].toUpperCase())}</div><div class="bubble"><div class="tdots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight;
}
function removeTyping() { const t=document.getElementById('typing'); if(t) t.remove(); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatMd(text) {
  let s = esc(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_,l,c) => `<pre><code>${c.trim()}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--accent);">$1</a>');
  s = s.replace(/((?:^[-*+] .+\n?)+)/gm, m => `<ul>${m.trim().split('\n').map(l=>`<li>${l.replace(/^[-*+] /,'')}</li>`).join('')}</ul>`);
  s = s.replace(/((?:^\d+\. .+\n?)+)/gm, m => `<ol>${m.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('')}</ol>`);
  s = s.split(/\n{2,}/).map(b => /^<(h[1-3]|ul|ol|pre|table|blockquote)/.test(b.trim()) ? b : `<p>${b.replace(/\n/g,'<br/>')}</p>`).join('');
  return s;
}
const inp = document.getElementById('inp');
inp.addEventListener('input', function() { this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
inp.addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
</script>
